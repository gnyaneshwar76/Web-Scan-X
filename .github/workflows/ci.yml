name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      - name: CLI smoke test against the demo fixture (127.0.0.1 only)
        shell: bash
        run: |
          python tools/demo_target.py --port 8765 &
          sleep 2
          # exit 2/1 = findings (expected on the vulnerable fixture); 3+ = real error
          set +e
          python -m webscanx http://127.0.0.1:8765/ -y -f json -o smoke
          rc=$?
          kill %1 || true
          test "$rc" -le 2 && test -s smoke.json
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: site
