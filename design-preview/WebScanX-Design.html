const f=document.getElementById('f'),B=[...document.querySelectorAll('button')];
function dec(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u)}
function show(i){f.srcdoc=dec(P[i].b64);B.forEach((b,j)=>b.classList.toggle('on',j==i));location.hash=i}
B.forEach(b=>b.onclick=()=>show(+b.dataset.i));
addEventListener('keydown',e=>{const n=+e.key;if(n>=1&&n<=P.length)show(n-1)});
show(+location.hash.slice(1)||0);
</script></body></html>
