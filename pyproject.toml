[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "webscanx"
dynamic = ["version"]
description = "Local web vulnerability scanner: finds and explains issues, read-only by default."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []  # stdlib only

[project.scripts]
webscanx = "webscanx.cli:main"

[tool.setuptools.dynamic]
version = { attr = "webscanx.__version__" }

[tool.setuptools.packages.find]
include = ["webscanx*"]
