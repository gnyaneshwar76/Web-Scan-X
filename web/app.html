<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebScanX — localhost:8080</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { height: 100vh; display: grid; grid-template-columns: 240px 1fr; overflow: hidden; }
  .side { background: var(--surface); border-right: 1px solid var(--rule); display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 20px; border-bottom: 1px solid var(--rule); font-weight: 700; font-size: 16px; text-decoration: none; }
  .brand small { font: 500 10px var(--mono); color: var(--text2); border: 1px solid var(--rule); padding: 2px 6px; letter-spacing: .06em; }
  nav.main { padding: 12px 0; display: flex; flex-direction: column; }
  nav.main a { display: flex; align-items: center; gap: 12px; padding: 10px 20px; color: var(--text2); text-decoration: none; box-shadow: inset 2px 0 0 transparent; }
  nav.main a:hover { color: var(--text); background: var(--raised); }
  nav.main a[aria-current="page"] { color: var(--text); background: var(--raised); box-shadow: inset 2px 0 0 var(--mint); }
  nav.main svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; flex: none; }
  .side .foot { margin-top: auto; padding: 16px 20px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--text2); }
  .side .foot .dot { display: inline-block; width: 6px; height: 6px; background: var(--mint); margin-right: 8px; vertical-align: middle; }
  main { overflow: auto; min-width: 0; }
  .view { padding: 28px 32px 48px; }
  .view h1 { font-size: 24px; margin: 0; letter-spacing: -.02em; }
  .view .sub { margin: 4px 0 24px; color: var(--text2); }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 20px; }
  .top h1 { margin-right: 4px; }
  .top .grow { flex: 1; }

  /* New scan */
  .ns { display: grid; grid-template-columns: minmax(0, 640px) 260px; gap: 40px; align-items: start; }
  .field { margin-bottom: 28px; }
  .field > .label { display: flex; justify-content: space-between; margin-bottom: 10px; }
  .field .input.big { width: 100%; height: 48px; font-size: 15px; }
  .err { color: var(--high); font-size: 12px; margin-top: 6px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--rule); }
  .seg label { position: relative; padding: 12px 14px; cursor: pointer; border-right: 1px solid var(--rule); }
  .seg label:last-child { border-right: 0; }
  .seg input { position: absolute; opacity: 0; }
  .seg b { display: block; font-weight: 600; }
  .seg span { font: 11px/1.4 var(--mono); color: var(--text2); }
  .seg label:has(input:checked) { background: var(--raised); box-shadow: inset 0 0 0 1px var(--mint); }
  .seg label:has(input:focus-visible) { outline: 1px solid var(--mint); outline-offset: -3px; }
  .checks { border: 1px solid var(--rule); }
  .checks label { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--rule); cursor: pointer; }
  .checks label:last-child { border-bottom: 0; }
  .checks label span:last-child { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
  .auth { display: flex; gap: 14px; padding: 18px; background: var(--raised); border: 1px solid var(--rule); cursor: pointer; margin-bottom: 20px; }
  .auth:has(input:checked) { border-color: var(--mint); }
  .auth input { margin-top: 2px; }
  .auth b { display: block; }
  .auth span { color: var(--text2); font-size: 13px; }
  #startBtn { width: 100%; }
  .hint { text-align: center; font: 12px var(--mono); color: var(--muted); margin-top: 10px; }
  .recent h2 { font-size: 12px; margin: 34px 0 10px; }
  .recent button { display: block; width: 100%; text-align: left; background: none; border: 1px solid var(--rule); padding: 10px 12px; margin-bottom: 8px; }
  .recent button:hover { background: var(--raised); }
  .recent b { display: block; font: 500 12px var(--mono); word-break: break-all; }
  .recent span { font: 11px var(--mono); color: var(--muted); }

  /* Scanning */
  .tag { font: 600 10px var(--mono); letter-spacing: .08em; border: 1px solid var(--rule); padding: 3px 7px; color: var(--text2); text-transform: uppercase; }
  .progress { height: 4px; background: var(--raised); }
  .progress span { display: block; height: 100%; width: 0; background: var(--mint); transition: width .3s linear; }
  .pline { display: flex; justify-content: space-between; gap: 12px; font: 12px var(--mono); color: var(--text2); margin: 10px 0 20px; }
  .grid5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--rule); margin-bottom: 20px; }
  .grid5 > div { padding: 12px 14px; border-right: 1px solid var(--rule); min-width: 0; }
  .grid5 > div:last-child { border-right: 0; }
  .mstate { font: 12px var(--mono); color: var(--muted); margin-top: 2px; }
  .mstate.running { color: var(--mint); } .mstate.done { color: var(--text2); }
  .counter { display: flex; align-items: center; justify-content: space-between; }
  .counter b { font: 700 24px var(--mono); }
  .panel { border: 1px solid var(--rule); background: var(--surface); }
  .panel > header { display: flex; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
  .live td.time { font: 12px var(--mono); color: var(--muted); text-align: right; }
  .live tr { animation: in .35s ease; }
  @keyframes in { from { background: var(--raised); } }
  details.log { margin-top: 20px; border: 1px solid var(--rule); }
  details.log summary { padding: 10px 14px; cursor: pointer; font-weight: 600; }
  .log pre { margin: 0; max-height: 180px; overflow: auto; padding: 10px 14px; border-top: 1px solid var(--rule); font: 12px/1.7 var(--mono); color: var(--muted); }
  .done-box { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px; border: 1px solid var(--mint); background: var(--raised); margin-bottom: 20px; }
  .done-box p { margin: 0; flex: 1; }

  /* Results */
  #reportRoot { height: calc(100vh - 150px); min-height: 520px; }
  .empty-state { border: 1px dashed var(--rule); padding: 56px 24px; text-align: center; }

  /* History + settings */
  .htools { display: flex; gap: 8px; margin-bottom: 12px; }
  .htools .input { width: 280px; }
  .tbl-wrap { border: 1px solid var(--rule); overflow-x: auto; }
  .tbl-wrap table td.acts { text-align: right; }
  .minibar { display: inline-flex; width: 80px; height: 4px; gap: 1px; vertical-align: middle; margin-right: 10px; background: var(--raised); }
  .settings { max-width: 760px; border-top: 1px solid var(--rule); }
  .srow { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid var(--rule); }
  .srow > div:first-child { min-width: 220px; }
  .srow p { margin: 2px 0 0; color: var(--text2); font-size: 13px; }
  .srow .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .srow .seg { min-width: 300px; } .srow .seg label { padding: 8px 12px; text-align: center; }
  .srow .ctl.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; }
  .cols label { display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .savebar { display: flex; justify-content: flex-end; gap: 8px; max-width: 760px; margin-top: 24px; }

  /* Export dialog */
  dialog { width: min(560px, calc(100vw - 32px)); padding: 0; background: var(--surface); color: var(--text); border: 1px solid var(--rule); }
  dialog::backdrop { background: rgb(0 0 0 / .8); }
  dialog header { display: flex; justify-content: space-between; align-items: start; padding: 20px 24px 0; }
  dialog h2 { margin: 0; font-size: 18px; }
  .dbody { padding: 20px 24px; }
  .formats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 20px; }
  .formats label { position: relative; border: 1px solid var(--rule); padding: 12px 14px; cursor: pointer; }
  .formats input { position: absolute; opacity: 0; }
  .formats label:has(input:checked) { border-color: var(--mint); background: var(--raised); }
  .formats label:has(input:focus-visible) { outline: 1px solid var(--mint); }
  .formats b { display: block; } .formats span { font-size: 12px; color: var(--text2); }
  .opt { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid var(--rule); cursor: pointer; }
  dialog footer { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--rule); }

  @media (max-width: 900px) {
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; height: 100dvh; }
    .side { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--rule); min-width: 0; }
    .brand { border-bottom: 0; }
    nav.main { flex-direction: row; padding: 0; overflow-x: auto; flex: 1 1 100%; min-width: 0; border-top: 1px solid var(--rule); }
    nav.main a { padding: 18px 12px; box-shadow: inset 0 -2px 0 transparent; white-space: nowrap; }
    nav.main a[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--mint); }
    .side .foot { display: none; }
    .view { padding: 20px 16px 40px; }
    .ns { grid-template-columns: 1fr; gap: 0; }
    .seg { grid-template-columns: 1fr; } .seg label { border-right: 0; border-bottom: 1px solid var(--rule); }
    .grid5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid5 > div { border-bottom: 1px solid var(--rule); }
    #reportRoot { height: auto; }
    .htools .input { width: 100%; }
    .cols { grid-template-columns: 1fr; } .srow .seg { min-width: 0; width: 100%; }
  }
  @media print {
    body { display: block; height: auto; overflow: visible; }
    .side, .top .btn, .r-tools, dialog, .r-detail .actions { display: none !important; }
    main { overflow: visible; } #reportRoot { height: auto; }
    .r-body { grid-template-columns: 1fr; } .r-list, .r-detail { overflow: visible; }
  }
</style>
</head>
<body>
<aside class="side">
  <a class="brand" href="#new">WebScanX <small>LOCAL · v1.0</small></a>
  <nav class="main" aria-label="Main">
    <a href="#new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New Scan</a>
    <a href="#results"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Results</a>
    <a href="#history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</a>
    <a href="#settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
  </nav>
  <div class="foot"><span class="dot"></span>Offline-safe — nothing leaves this device<div class="mono muted" style="margin-top:6px">localhost:8080</div></div>
</aside>

<main id="main"></main>

<dialog id="exportDlg" aria-labelledby="exTitle">
  <form method="dialog" id="exportForm">
    <header><div><h2 id="exTitle">Export report</h2><div class="mono text2" style="font-size:12px;margin-top:4px" id="exMeta"></div></div>
      <button class="btn btn-text" value="cancel" aria-label="Close" style="font-size:18px">×</button></header>
    <div class="dbody">
      <div class="label">Format</div>
      <div class="formats">
        <label><input type="radio" name="fmt" value="pdf" checked><b>PDF</b><span>Share with a client</span></label>
        <label><input type="radio" name="fmt" value="md"><b>Markdown</b><span>Paste into a ticket</span></label>
        <label><input type="radio" name="fmt" value="html"><b>HTML</b><span>Open in any browser</span></label>
        <label><input type="radio" name="fmt" value="json"><b>JSON</b><span>Feed into other tools</span></label>
      </div>
      <label class="opt">Include evidence <input class="switch" type="checkbox" name="evidence" checked></label>
      <label class="opt">Include ignored findings <input class="switch" type="checkbox" name="ignored"></label>
      <label class="opt">Hide target hostname <input class="switch" type="checkbox" name="redact"></label>
      <div class="label" style="margin:18px 0 8px">File name</div>
      <input class="input" style="width:100%" name="fname" id="exName">
    </div>
    <footer><button class="btn btn-text" value="cancel">Cancel</button><button class="btn btn-primary" value="export" id="exGo">Export</button></footer>
  </form>
</dialog>

<script src="report.js"></script>
<script src="app.js"></script>
</body>
</html>
